# Production stack for a single VPS (e.g. Hostinger KVM 2).
# Values come from ./.env (copy .env.example). Start with: docker compose up -d --build
name: urbanfruto

services:
  web:
    build:
      context: ./frontend
      args:
        REACT_APP_MEDIA_URL: ${R2_PUBLIC_URL:?set R2_PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      MEDIA_ORIGIN: ${R2_PUBLIC_URL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://${MONGO_USER:?set MONGO_USER}:${MONGO_PASSWORD:?set MONGO_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-urbanfruto}
      CORS_ORIGINS: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECURE: "true"
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    # Not published: only reachable through Caddy at /api.

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: the database is never exposed to the internet.

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
